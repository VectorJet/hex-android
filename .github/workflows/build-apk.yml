name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (arm64-v8a)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK & NDK
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platforms;android-36
            build-tools;36.0.0
            ndk;27.2.12479018
            cmake;3.22.1

      - name: Cache Gradle & CMake FetchContent
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'app/src/main/cpp/CMakeLists.txt') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Configure Maven Central mirror for CI runners
        run: |
          mkdir -p ~/.gradle/init.d
          cat <<'INIT' > ~/.gradle/init.d/maven-mirror.init.gradle.kts
          val mirrorUrl = "https://maven-central.storage-download.googleapis.com/maven2/"
          val centralHost = "repo.maven.apache.org"

          fun RepositoryHandler.prependGoogleMirror() {
              val hasCentral = any { it is MavenArtifactRepository && it.url.host == centralHost }
              if (hasCentral) {
                  val mirror = maven {
                      name = "GoogleMavenCentralMirror"
                      url = uri(mirrorUrl)
                  }
                  remove(mirror)
                  add(0, mirror)
              }
          }

          gradle.settingsEvaluated {
              pluginManagement.repositories.prependGoogleMirror()
              dependencyResolutionManagement.repositories.prependGoogleMirror()
          }

          allprojects {
              buildscript.repositories.prependGoogleMirror()
              repositories.prependGoogleMirror()
          }
          INIT

      - name: Generate CI signing keystore for release APK
        run: |
          mkdir -p ~/.config/hex-android
          keytool -genkeypair -v \
            -keystore ~/.config/hex-android/upload.jks \
            -storepass hexandroid \
            -keypass hexandroid \
            -alias hex \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Hex Android, OU=Dev, O=VectorJet, L=Nagpur, S=MH, C=IN"
          cat <<PROPS > ~/.config/hex-android/keystore.properties
          storeFile=upload.jks
          storePassword=hexandroid
          keyAlias=hex
          keyPassword=hexandroid
          PROPS

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: hex-android-apks
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
